
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Digital Profile | QRPlatform</title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {

            min-height: 100vh;

            font-family:
                Inter,
                Arial,
                Helvetica,
                sans-serif;

            background:
                radial-gradient(
                    circle at top left,
                    #dbeafe 0%,
                    transparent 35%
                ),
                radial-gradient(
                    circle at bottom right,
                    #e0e7ff 0%,
                    transparent 35%
                ),
                #f8fafc;

            color: #0f172a;

            padding: 25px 16px;

        }


        .page {

            width: 100%;

            max-width: 560px;

            margin: auto;

        }


        /* =================================
           BRAND
        ================================= */

        .brand {

            text-align: center;

            margin-bottom: 18px;

        }


        .brand-name {

            font-size: 20px;

            font-weight: 900;

            letter-spacing: -0.5px;

            color: #2563eb;

        }


        .brand-tagline {

            margin-top: 4px;

            font-size: 11px;

            color: #94a3b8;

        }


        /* =================================
           PROFILE CARD
        ================================= */

        .profile-card {

            position: relative;

            overflow: hidden;

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.88
                );

            border:
                1px solid
                rgba(
                    148,
                    163,
                    184,
                    0.25
                );

            border-radius: 30px;

            padding: 38px 30px 30px;

            box-shadow:
                0 30px 80px
                rgba(
                    15,
                    23,
                    42,
                    0.12
                );

            backdrop-filter:
                blur(20px);

        }


        .profile-card::before {

            content: "";

            position: absolute;

            width: 180px;

            height: 180px;

            top: -90px;

            right: -70px;

            border-radius: 50%;

            background:
                rgba(
                    59,
                    130,
                    246,
                    0.10
                );

            pointer-events: none;

        }


        /* =================================
           PHOTO
        ================================= */

        .photo-ring {

            width: 132px;

            height: 132px;

            margin:
                0 auto 18px;

            padding: 5px;

            border-radius: 50%;

            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #7c3aed,
                    #06b6d4
                );

            box-shadow:
                0 15px 40px
                rgba(
                    37,
                    99,
                    235,
                    0.22
                );

        }


        .profile-icon {

            width: 100%;

            height: 100%;

            border-radius: 50%;

            display: flex;

            align-items: center;

            justify-content: center;

            overflow: hidden;

            background:
                linear-gradient(
                    135deg,
                    #e2e8f0,
                    #f8fafc
                );

            color: #64748b;

            font-size: 48px;

        }


        .profile-photo {

            padding: 0;

        }


        .profile-photo img {

            width: 100%;

            height: 100%;

            object-fit: cover;

            display: block;

        }


        /* =================================
           CATEGORY
        ================================= */

        .category {

            display: inline-flex;

            align-items: center;

            gap: 6px;

            padding:
                7px 13px;

            margin-bottom: 13px;

            border-radius: 999px;

            background:
                rgba(
                    37,
                    99,
                    235,
                    0.08
                );

            border:
                1px solid
                rgba(
                    37,
                    99,
                    235,
                    0.12
                );

            color: #2563eb;

            font-size: 11px;

            font-weight: 800;

            letter-spacing:
                0.5px;

            text-transform:
                uppercase;

        }


        .category::before {

            content: "●";

            font-size: 8px;

        }


        /* =================================
           NAME
        ================================= */

        h1 {

            font-size: 32px;

            line-height: 1.15;

            letter-spacing:
                -1px;

            color: #0f172a;

            margin-bottom: 10px;

        }


        /* =================================
           BIO
        ================================= */

        .bio {

            max-width: 440px;

            margin:
                0 auto 25px;

            color: #64748b;

            font-size: 14px;

            line-height: 1.7;

        }


        /* =================================
           QUICK ACTIONS
        ================================= */

        .quick-actions {

            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 10px;

            margin-bottom: 26px;

        }


        .quick-btn {

            min-height: 70px;

            border: none;

            border-radius: 16px;

            background:
                #f8fafc;

            border:
                1px solid
                #e2e8f0;

            color: #334155;

            text-decoration: none;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            gap: 6px;

            cursor: pointer;

            transition:
                0.2s ease;

        }


        .quick-btn:hover {

            transform:
                translateY(-3px);

            background:
                #eff6ff;

            border-color:
                #bfdbfe;

        }


        .quick-icon {

            font-size: 20px;

        }


        .quick-label {

            font-size: 10px;

            font-weight: 800;

        }


        /* =================================
           SECTION
        ================================= */

        .section {

            text-align: left;

            padding-top: 24px;

            margin-top: 24px;

            border-top:
                1px solid
                #e5e7eb;

        }


        .section-title {

            display: flex;

            align-items: center;

            gap: 8px;

            margin-bottom: 15px;

            font-size: 12px;

            font-weight: 900;

            color: #2563eb;

            text-transform:
                uppercase;

            letter-spacing:
                0.8px;

        }


        .section-title::before {

            content: "";

            width: 4px;

            height: 16px;

            border-radius: 10px;

            background:
                #2563eb;

        }


        /* =================================
           INFO
        ================================= */

        .info-item {

            display: flex;

            align-items: flex-start;

            gap: 12px;

            padding: 10px 0;

        }


        .info-icon {

            width: 38px;

            height: 38px;

            flex-shrink: 0;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 12px;

            background:
                #eff6ff;

            font-size: 16px;

        }


        .info-content {

            min-width: 0;

            flex: 1;

        }


        .info-label {

            display: block;

            margin-bottom: 3px;

            color: #94a3b8;

            font-size: 10px;

            font-weight: 800;

            text-transform:
                uppercase;

            letter-spacing:
                0.5px;

        }


        .info-content a,
        .info-content span {

            color: #334155;

            font-size: 14px;

            line-height: 1.5;

            text-decoration: none;

            word-break:
                break-word;

        }


        .info-content a:hover {

            color: #2563eb;

        }


        /* =================================
           CONTENT BOXES
        ================================= */

        .skills-box,
        .experience-box {

            padding: 14px;

            border-radius: 14px;

            background:
                #f8fafc;

            border:
                1px solid
                #e2e8f0;

            color: #475569;

            font-size: 13px;

            line-height: 1.7;

        }


        /* =================================
           BUSINESS
        ================================= */

        .business-box {

            padding: 18px;

            border-radius: 17px;

            background:
                linear-gradient(
                    135deg,
                    #eff6ff,
                    #f8fafc
                );

            border:
                1px solid
                #dbeafe;

        }


        .business-name {

            font-size: 18px;

            font-weight: 900;

            color: #0f172a;

            margin-bottom: 7px;

        }


        .business-location {

            color: #64748b;

            font-size: 13px;

        }


        /* =================================
           MAIN BUTTONS
        ================================= */

        .actions {

            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 10px;

            margin-top: 30px;

        }


        .action-btn {

            min-height: 48px;

            border: none;

            border-radius: 14px;

            cursor: pointer;

            font-size: 13px;

            font-weight: 800;

            transition:
                0.2s ease;

        }


        .action-btn:hover {

            transform:
                translateY(-2px);

        }


        .share-btn {

            color: white;

            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #4f46e5
                );

            box-shadow:
                0 10px 25px
                rgba(
                    37,
                    99,
                    235,
                    0.20
                );

        }


        .save-btn {

            color: white;

            background:
                linear-gradient(
                    135deg,
                    #059669,
                    #0d9488
                );

            box-shadow:
                0 10px 25px
                rgba(
                    5,
                    150,
                    105,
                    0.18
                );

        }


        .home-btn {

            color: #2563eb;

            background:
                #eff6ff;

            border:
                1px solid
                #dbeafe;

        }


        /* =================================
           FOOTER
        ================================= */

        .footer {

            text-align: center;

            margin-top: 18px;

            color: #94a3b8;

            font-size: 10px;

        }


        .footer strong {

            color: #64748b;

        }


        /* =================================
           LOADING / ERROR
        ================================= */

        .loading {

            text-align: center;

            padding: 30px;

            color: #64748b;

            font-size: 14px;

        }


        .error {

            text-align: center;

            padding: 30px;

            color: #dc2626;

            font-size: 14px;

            line-height: 1.6;

        }


        /* =================================
           MOBILE
        ================================= */

        @media (
            max-width: 600px
        ) {

            body {

                padding:
                    14px 10px;

            }


            .profile-card {

                padding:
                    32px 18px 22px;

                border-radius:
                    24px;

            }


            h1 {

                font-size: 27px;

            }


            .photo-ring {

                width: 112px;

                height: 112px;

            }


            .quick-actions {

                gap: 7px;

            }


            .quick-btn {

                min-height: 64px;

            }


            .actions {

                grid-template-columns:
                    1fr;

            }

        }

    </style>

</head>


<body>


    <div class="page">


        <!-- =================================
             BRAND
        ================================= -->

        <div class="brand">

            <div class="brand-name">

                QRPlatform

            </div>

            <div class="brand-tagline">

                Your identity. One QR.

            </div>

        </div>



        <!-- =================================
             PROFILE
        ================================= -->

        <div
            class="profile-card"
            id="profileCard"
        >

            <div class="loading">

                Loading profile...

            </div>

        </div>


    </div>



    <script>


        // =========================================
        // PROFILE ID
        // =========================================

        const params =
            new URLSearchParams(
                window.location.search
            );


        const profileId =
            params.get("id");


        const profileCard =
            document.getElementById(
                "profileCard"
            );



        // =========================================
        // ESCAPE HTML
        // =========================================

        function escapeHTML(value) {

            if (!value) {

                return "";

            }


            return String(value)

                .replace(
                    /&/g,
                    "&amp;"
                )

                .replace(
                    /</g,
                    "&lt;"
                )

                .replace(
                    />/g,
                    "&gt;"
                )

                .replace(
                    /"/g,
                    "&quot;"
                )

                .replace(
                    /'/g,
                    "&#039;"
                );

        }



        // =========================================
        // ESCAPE ATTRIBUTE
        // =========================================

        function escapeAttribute(value) {

            return escapeHTML(value);

        }



        // =========================================
        // SAFE URL
        // =========================================

        function safeURL(url) {

            if (!url) {

                return "";

            }


            const value =
                String(url).trim();


            if (
                value.startsWith(
                    "https://"
                ) ||

                value.startsWith(
                    "http://"
                )
            ) {

                return value;

            }


            return "";

        }



        // =========================================
        // LOAD PROFILE
        // =========================================

        async function loadProfile() {

            if (!profileId) {

                profileCard.innerHTML = `

                    <div class="error">

                        Profile ID is missing.

                    </div>

                `;

                return;

            }


            try {

                const response =
                    await fetch(
                        `/api/profile/${encodeURIComponent(profileId)}`
                    );


                const data =
                    await response.json();


                if (
                    !response.ok ||
                    !data.success
                ) {

                    throw new Error(
                        data.message ||
                        "Profile not found."
                    );

                }


                displayProfile(
                    data.profile
                );

            }


            catch (error) {

                console.error(
                    error
                );


                profileCard.innerHTML = `

                    <div class="error">

                        <strong>
                            Profile not found
                        </strong>

                        <br><br>

                        ${escapeHTML(
                            error.message
                        )}

                    </div>

                `;

            }

        }



        // =========================================
        // DISPLAY PROFILE
        // =========================================

        function displayProfile(profile) {


            // =====================================
            // PHOTO
            // =====================================

            let photoHTML = `

                <div class="profile-icon">

                    👤

                </div>

            `;


            if (profile.profilePhoto) {

                photoHTML = `

                    <div
                        class="profile-icon profile-photo"
                    >

                        <img
                            src="${escapeAttribute(
                                profile.profilePhoto
                            )}"
                            alt="${escapeAttribute(
                                profile.name
                            )}"
                        >

                    </div>

                `;

            }



            // =====================================
            // BASIC
            // =====================================

            let html = `

                <div class="photo-ring">

                    ${photoHTML}

                </div>


                <div class="category">

                    ${escapeHTML(
                        profile.category
                    )}

                </div>


                <h1>

                    ${escapeHTML(
                        profile.name
                    )}

                </h1>

            `;



            // =====================================
            // BIO
            // =====================================

            if (profile.bio) {

                html += `

                    <div class="bio">

                        ${escapeHTML(
                            profile.bio
                        )}

                    </div>

                `;

            }



            // =====================================
            // QUICK ACTIONS
            // =====================================

            html += `

                <div class="quick-actions">

            `;


            if (profile.email) {

                html += `

                    <a
                        class="quick-btn"
                        href="mailto:${escapeAttribute(
                            profile.email
                        )}"
                    >

                        <span class="quick-icon">
                            ✉️
                        </span>

                        <span class="quick-label">
                            Email
                        </span>

                    </a>

                `;

            }


            if (profile.phone) {

                html += `

                    <a
                        class="quick-btn"
                        href="tel:${escapeAttribute(
                            profile.phone
                        )}"
                    >

                        <span class="quick-icon">
                            📞
                        </span>

                        <span class="quick-label">
                            Call
                        </span>

                    </a>

                `;

            }


            const quickWebsite =
                safeURL(
                    profile.website
                );


            if (quickWebsite) {

                html += `

                    <a
                        class="quick-btn"
                        href="${escapeAttribute(
                            quickWebsite
                        )}"
                        target="_blank"
                        rel="noopener noreferrer"
                    >

                        <span class="quick-icon">
                            🌐
                        </span>

                        <span class="quick-label">
                            Website
                        </span>

                    </a>

                `;

            }


            html += `

                </div>

            `;



            // =====================================
            // PROFESSIONAL
            // =====================================

            if (
                profile.category ===
                "Professional"
            ) {


                if (
                    profile.skills ||
                    profile.experience
                ) {

                    html += `

                        <div class="section">

                            <div class="section-title">

                                Professional Details

                            </div>

                    `;


                    if (profile.skills) {

                        html += `

                            <div class="info-item">

                                <div class="info-icon">
                                    💻
                                </div>

                                <div class="info-content">

                                    <span class="info-label">
                                        Skills
                                    </span>

                                    <div class="skills-box">

                                        ${escapeHTML(
                                            profile.skills
                                        )}

                                    </div>

                                </div>

                            </div>

                        `;

                    }


                    if (profile.experience) {

                        html += `

                            <div class="info-item">

                                <div class="info-icon">
                                    📈
                                </div>

                                <div class="info-content">

                                    <span class="info-label">
                                        Experience
                                    </span>

                                    <div class="experience-box">

                                        ${escapeHTML(
                                            profile.experience
                                        )}

                                    </div>

                                </div>

                            </div>

                        `;

                    }


                    html += `

                        </div>

                    `;

                }

            }



            // =====================================
            // BUSINESS
            // =====================================

            if (
                profile.category ===
                "Business"
            ) {


                if (
                    profile.businessName ||
                    profile.businessLocation
                ) {

                    html += `

                        <div class="section">

                            <div class="section-title">

                                Business

                            </div>


                            <div class="business-box">

                    `;


                    if (
                        profile.businessName
                    ) {

                        html += `

                            <div class="business-name">

                                ${escapeHTML(
                                    profile.businessName
                                )}

                            </div>

                        `;

                    }


                    if (
                        profile.businessLocation
                    ) {

                        html += `

                            <div class="business-location">

                                📍
                                ${escapeHTML(
                                    profile.businessLocation
                                )}

                            </div>

                        `;

                    }


                    html += `

                            </div>

                        </div>

                    `;

                }

            }



            // =====================================
            // SOCIAL PROFILES
            // =====================================

            if (
                profile.linkedin ||
                profile.github
            ) {

                html += `

                    <div class="section">

                        <div class="section-title">

                            Social Profiles

                        </div>

                `;


                const linkedinURL =
                    safeURL(
                        profile.linkedin
                    );


                if (linkedinURL) {

                    html += `

                        <div class="info-item">

                            <div class="info-icon">
                                💼
                            </div>

                            <div class="info-content">

                                <span class="info-label">
                                    LinkedIn
                                </span>

                                <a
                                    href="${escapeAttribute(
                                        linkedinURL
                                    )}"
                                    target="_blank"
                                    rel="noopener noreferrer"
                                >

                                    View LinkedIn Profile →

                                </a>

                            </div>

                        </div>

                    `;

                }


                const githubURL =
                    safeURL(
                        profile.github
                    );


                if (githubURL) {

                    html += `

                        <div class="info-item">

                            <div class="info-icon">
                                🐙
                            </div>

                            <div class="info-content">

                                <span class="info-label">
                                    GitHub
                                </span>

                                <a
                                    href="${escapeAttribute(
                                        githubURL
                                    )}"
                                    target="_blank"
                                    rel="noopener noreferrer"
                                >

                                    View GitHub Profile →

                                </a>

                            </div>

                        </div>

                    `;

                }


                html += `

                    </div>

                `;

            }



            // =====================================
            // WEBSITE
            // =====================================

            if (
                profile.website &&
                quickWebsite
            ) {

                html += `

                    <div class="section">

                        <div class="section-title">

                            Website

                        </div>


                        <div class="info-item">

                            <div class="info-icon">
                                🌐
                            </div>

                            <div class="info-content">

                                <span class="info-label">
                                    Website
                                </span>

                                <a
                                    href="${escapeAttribute(
                                        quickWebsite
                                    )}"
                                    target="_blank"
                                    rel="noopener noreferrer"
                                >

                                    ${escapeHTML(
                                        profile.website
                                    )}

                                </a>

                            </div>

                        </div>

                    </div>

                `;

            }



            // =====================================
            // MAIN ACTIONS
            // =====================================

            html += `

                <div class="actions">

                    <button
                        class="action-btn share-btn"
                        onclick="shareProfile()"
                    >

                        🔗 Share Profile

                    </button>


                    <button
                        class="action-btn save-btn"
                        onclick="saveContact()"
                    >

                        📇 Save Contact

                    </button>


                    <button
                        class="action-btn home-btn"
                        onclick="goHome()"
                    >

                        🏠 QRPlatform

                    </button>

                </div>


                <div class="footer">

                    Created with
                    <strong>QRPlatform</strong>

                </div>

            `;


            profileCard.innerHTML =
                html;


            // Store current profile
            window.currentProfile =
                profile;

        }



        // =========================================
        // SHARE
        // =========================================

        async function shareProfile() {

            const url =
                window.location.href;


            try {

                if (
                    navigator.share
                ) {

                    await navigator.share({

                        title:
                            "QRPlatform Profile",

                        text:
                            "Check out this digital profile.",

                        url:
                            url

                    });

                }

                else {

                    await navigator.clipboard.writeText(
                        url
                    );

                    alert(
                        "Profile link copied!"
                    );

                }

            }

            catch (error) {

                console.log(
                    error
                );

            }

        }



        // =========================================
        // SAVE CONTACT
        // =========================================

        function saveContact() {

            const profile =
                window.currentProfile;


            if (!profile) {

                alert(
                    "Profile data is not available."
                );

                return;

            }


            // =====================================
            // VCARD
            // =====================================

            let vCard =
                "BEGIN:VCARD\r\n";

            vCard +=
                "VERSION:3.0\r\n";


            vCard +=
                `FN:${escapeVCard(
                    profile.name
                )}\r\n`;


            if (profile.phone) {

                vCard +=
                    `TEL;TYPE=CELL:${escapeVCard(
                        profile.phone
                    )}\r\n`;

            }


            if (profile.email) {

                vCard +=
                    `EMAIL:${escapeVCard(
                        profile.email
                    )}\r\n`;

            }


            const website =
                safeURL(
                    profile.website
                );


            if (website) {

                vCard +=
                    `URL:${escapeVCard(
                        website
                    )}\r\n`;

            }


            if (profile.linkedin) {

                const linkedin =
                    safeURL(
                        profile.linkedin
                    );


                if (linkedin) {

                    vCard +=
                        `X-SOCIALPROFILE;TYPE=linkedin:${escapeVCard(
                            linkedin
                        )}\r\n`;

                }

            }


            if (profile.github) {

                const github =
                    safeURL(
                        profile.github
                    );


                if (github) {

                    vCard +=
                        `X-SOCIALPROFILE;TYPE=github:${escapeVCard(
                            github
                        )}\r\n`;

                }

            }


            vCard +=
                "END:VCARD\r\n";



            // =====================================
            // CREATE FILE
            // =====================================

            const blob =
                new Blob(
                    [vCard],
                    {
                        type:
                            "text/vcard;charset=utf-8"
                    }
                );


            const url =
                URL.createObjectURL(
                    blob
                );


            const link =
                document.createElement(
                    "a"
                );


            link.href =
                url;


            link.download =
                `${sanitizeFileName(
                    profile.name
                ) || "contact"}.vcf`;


            document.body.appendChild(
                link
            );


            link.click();


            document.body.removeChild(
                link
            );


            URL.revokeObjectURL(
                url
            );

        }



        // =========================================
        // VCARD ESCAPE
        // =========================================

        function escapeVCard(value) {

            if (!value) {

                return "";

            }


            return String(value)

                .replace(
                    /\\/g,
                    "\\\\"
                )

                .replace(
                    /\n/g,
                    "\\n"
                )

                .replace(
                    /,/g,
                    "\\,"
                )

                .replace(
                    /;/g,
                    "\\;"
                );

        }



        // =========================================
        // FILE NAME
        // =========================================

        function sanitizeFileName(value) {

            if (!value) {

                return "";

            }


            return String(value)

                .replace(
                    /[<>:"/\\|?*]/g,
                    ""
                )

                .trim()

                .replace(
                    /\s+/g,
                    "_"
                );

        }



        // =========================================
        // HOME
        // =========================================

        function goHome() {

            window.location.href =
                "/";

        }



        // =========================================
        // START
        // =========================================

        loadProfile();


    </script>


</body>
